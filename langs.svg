<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="100%" height="100%">
  <defs>
    <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D0A" />
      <stop offset="100%" stop-color="#0B1A14" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@600;800&amp;display=swap');
    text { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    /* Animated Bars */
    .bar-anim {
      transform-origin: left;
      animation: growBar 1.4s ease-out forwards;
    }
    @keyframes growBar {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
  </style>

  <!-- Card Body -->
  <rect width="478" height="208" x="1" y="1" rx="16" fill="url(#langsBg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Header -->
  <text x="24" y="32" font-size="14" font-weight="800" fill="#00FF88" letter-spacing="1">// TOP LANGUAGES</text>
  <text x="456" y="32" text-anchor="end" font-size="11" font-weight="700" fill="#94A3B8" class="mono">ACTIVE STACK</text>
  <line x1="24" y1="44" x2="456" y2="44" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" />

  <!-- Stacked Meter Bar -->
  <g transform="translate(24, 60)">
    <rect width="432" height="12" rx="6" fill="#1E293B" />
    <!-- JS (42%) -->
    <rect class="bar-anim" width="181" height="12" rx="6" fill="#F7DF1E" />
    <!-- React/TS (26%) -->
    <rect class="bar-anim" x="184" width="112" height="12" fill="#61DAFB" />
    <!-- HTML/CSS (18%) -->
    <rect class="bar-anim" x="299" width="77" height="12" fill="#E34F26" />
    <!-- SQL (14%) -->
    <rect class="bar-anim" x="379" width="53" height="12" rx="6" fill="#00758F" />
  </g>

  <!-- Language Details List -->
  <g transform="translate(24, 105)">
    <!-- Column 1 -->
    <!-- JavaScript -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#F7DF1E" />
      <text x="20" y="10" font-size="12.5" font-weight="700" fill="#F0FDF4">JavaScript</text>
      <text x="140" y="10" font-size="12" font-weight="700" fill="#94A3B8" class="mono">42%</text>
      <rect width="180" height="4" y="18" rx="2" fill="#1E293B" />
      <rect class="bar-anim" width="75" height="4" y="18" rx="2" fill="#F7DF1E" />
    </g>

    <!-- React & TypeScript -->
    <g transform="translate(0, 42)">
      <circle cx="6" cy="6" r="5" fill="#61DAFB" />
      <text x="20" y="10" font-size="12.5" font-weight="700" fill="#F0FDF4">React / TS</text>
      <text x="140" y="10" font-size="12" font-weight="700" fill="#94A3B8" class="mono">26%</text>
      <rect width="180" height="4" y="18" rx="2" fill="#1E293B" />
      <rect class="bar-anim" width="47" height="4" y="18" rx="2" fill="#61DAFB" />
    </g>

    <!-- Column 2 -->
    <!-- HTML5 & CSS3 -->
    <g transform="translate(240, 0)">
      <circle cx="6" cy="6" r="5" fill="#E34F26" />
      <text x="20" y="10" font-size="12.5" font-weight="700" fill="#F0FDF4">HTML &amp; CSS</text>
      <text x="140" y="10" font-size="12" font-weight="700" fill="#94A3B8" class="mono">18%</text>
      <rect width="180" height="4" y="18" rx="2" fill="#1E293B" />
      <rect class="bar-anim" width="32" height="4" y="18" rx="2" fill="#E34F26" />
    </g>

    <!-- SQL & Databases -->
    <g transform="translate(240, 42)">
      <circle cx="6" cy="6" r="5" fill="#00758F" />
      <text x="20" y="10" font-size="12.5" font-weight="700" fill="#F0FDF4">SQL &amp; DBs</text>
      <text x="140" y="10" font-size="12" font-weight="700" fill="#94A3B8" class="mono">14%</text>
      <rect width="180" height="4" y="18" rx="2" fill="#1E293B" />
      <rect class="bar-anim" width="25" height="4" y="18" rx="2" fill="#00758F" />
    </g>
  </g>
</svg>