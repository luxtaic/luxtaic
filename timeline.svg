<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <defs>
    <linearGradient id="tlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1720" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>

    <linearGradient id="cardGrad25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 245, 160, 0.08)" />
      <stop offset="100%" stop-color="rgba(15, 23, 30, 0.9)" />
    </linearGradient>

    <linearGradient id="cardGrad26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 217, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(15, 23, 30, 0.9)" />
    </linearGradient>

    <filter id="tlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@600;700;800;900&amp;display=swap');
    text { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    /* Animated traveling pulse along connecting bridge */
    .conduit-dash {
      stroke-dasharray: 8 16;
      animation: conduitFlow 2s linear infinite;
    }
    @keyframes conduitFlow {
      to { stroke-dashoffset: -48; }
    }

    .node-pulse {
      animation: nPulse 2s ease-in-out infinite alternate;
    }
    @keyframes nPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 5px #00F5A0); }
    }
  </style>

  <!-- Outer Card Body -->
  <rect width="818" height="218" x="1" y="1" rx="14" fill="url(#tlBg)" stroke="#00F5A0" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Header -->
  <text x="24" y="32" font-size="13" font-weight="800" fill="#00F5A0" letter-spacing="1.2">// LEARNING TIMELINE &amp; MILESTONES</text>
  <text x="796" y="32" text-anchor="end" font-size="10.5" font-weight="700" fill="#00D9FF" class="mono">2025 → 2026+</text>
  <line x1="24" y1="44" x2="796" y2="44" stroke="#00F5A0" stroke-width="1" stroke-opacity="0.15" />

  <!-- Stage 1 Card: 2025 Foundations (Left, x: 24 to 364) -->
  <g transform="translate(24, 62)">
    <rect width="345" height="135" rx="12" fill="url(#cardGrad25)" stroke="#00F5A0" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Year Badge -->
    <rect x="20" y="18" width="65" height="24" rx="12" fill="#00F5A0" />
    <text x="52.5" y="34" text-anchor="middle" font-size="12" font-weight="900" fill="#0B0F14" class="mono">2025</text>
    <text x="96" y="34" font-size="11" font-weight="800" fill="#00F5A0" letter-spacing="1">FOUNDATIONS</text>

    <!-- Milestones List (Cleanly separated from any lines) -->
    <g transform="translate(20, 68)" font-size="12" font-weight="700">
      <circle cx="4" cy="4" r="3.5" fill="#00F5A0" />
      <text x="16" y="8" fill="#EAF2F2">BCA AI &amp; Data Science Undergrad</text>
      
      <circle cx="4" cy="34" r="3.5" fill="#00D9FF" />
      <text x="16" y="38" fill="#8B949E">Python, Java, Git &amp; Web Development</text>
    </g>
  </g>

  <!-- Connecting Animated Conduit Data Bridge (Between cards, perfectly clear) -->
  <g transform="translate(369, 130)">
    <!-- Base Conduit Line -->
    <line x1="0" y1="0" x2="82" y2="0" stroke="#00F5A0" stroke-width="2" opacity="0.25" />
    <!-- Traveling Photons -->
    <line x1="0" y1="0" x2="82" y2="0" stroke="#00D9FF" stroke-width="2.5" class="conduit-dash" />
    <!-- Arrowhead Indicator -->
    <polygon points="46, -4 54, 0 46, 4" fill="#00D9FF" />
  </g>

  <!-- Stage 2 Card: 2026 Frontier (Right, x: 451 to 796) -->
  <g transform="translate(451, 62)">
    <rect width="345" height="135" rx="12" fill="url(#cardGrad26)" stroke="#00D9FF" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Year Badge -->
    <rect x="20" y="18" width="65" height="24" rx="12" fill="#00D9FF" />
    <text x="52.5" y="34" text-anchor="middle" font-size="12" font-weight="900" fill="#0B0F14" class="mono">2026</text>
    <text x="96" y="34" font-size="11" font-weight="800" fill="#00D9FF" letter-spacing="1">CURRENT &amp; FORWARD</text>

    <!-- Milestones List -->
    <g transform="translate(20, 68)" font-size="12" font-weight="700">
      <circle cx="4" cy="4" r="3.5" fill="#00D9FF" />
      <text x="16" y="8" fill="#00F5A0">SmartCart (Inventory &amp; Billing App)</text>
      
      <circle cx="4" cy="34" r="3.5" fill="#00F5A0" />
      <text x="16" y="38" fill="#EAF2F2">AI, Data Science &amp; Machine Learning</text>
    </g>
  </g>
</svg>