<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="100%" height="100%">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D0A" />
      <stop offset="100%" stop-color="#0B1A14" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@600;800&amp;display=swap');
    text { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    /* Animated Rank Ring */
    .rank-circle {
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      animation: fillRank 1.8s ease-out forwards;
    }
    @keyframes fillRank {
      to { stroke-dashoffset: 28; }
    }

    /* Staggered Row Slide In */
    .stat-row {
      opacity: 0;
      transform: translateX(-15px);
      animation: slideInRow 0.6s ease-out forwards;
    }
    @keyframes slideInRow {
      to { opacity: 1; transform: translateX(0); }
    }
  </style>

  <!-- Card Body -->
  <rect width="478" height="208" x="1" y="1" rx="16" fill="url(#statsBg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Header -->
  <text x="24" y="32" font-size="14" font-weight="800" fill="#00FF88" letter-spacing="1">// GITHUB TELEMETRY</text>
  <text x="456" y="32" text-anchor="end" font-size="11" font-weight="700" fill="#00F0FF" class="mono">LIVE VERIFIED</text>
  <line x1="24" y1="44" x2="456" y2="44" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" />

  <!-- Left: Animated Rank Circle -->
  <g transform="translate(85, 125)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1E293B" stroke-width="8" />
    <!-- Animated Foreground Ring -->
    <circle class="rank-circle" cx="0" cy="0" r="45" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" transform="rotate(-90)" filter="url(#statGlow)" />
    <!-- Rank Grade -->
    <text x="0" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="#F0FDF4">A++</text>
    <text x="0" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#00FF88" letter-spacing="1">RANK</text>
  </g>

  <!-- Right: Stat Rows with Staggered Slide In -->
  <g transform="translate(175, 72)">
    <!-- Row 1: Commits -->
    <g class="stat-row" style="animation-delay: 0.2s;">
      <circle cx="10" cy="0" r="4" fill="#00FF88" />
      <text x="24" y="4" font-size="12.5" font-weight="600" fill="#F0FDF4">Total Lifetime Commits</text>
      <text x="275" y="4" text-anchor="end" font-size="13.5" font-weight="800" fill="#00FF88" class="mono">850+</text>
    </g>

    <!-- Row 2: Stars -->
    <g class="stat-row" transform="translate(0, 28)" style="animation-delay: 0.4s;">
      <circle cx="10" cy="0" r="4" fill="#00F0FF" />
      <text x="24" y="4" font-size="12.5" font-weight="600" fill="#F0FDF4">Total Stars Earned</text>
      <text x="275" y="4" text-anchor="end" font-size="13.5" font-weight="800" fill="#00F0FF" class="mono">120+</text>
    </g>

    <!-- Row 3: Pull Requests -->
    <g class="stat-row" transform="translate(0, 56)" style="animation-delay: 0.6s;">
      <circle cx="10" cy="0" r="4" fill="#10B981" />
      <text x="24" y="4" font-size="12.5" font-weight="600" fill="#F0FDF4">Pull Requests Contributed</text>
      <text x="275" y="4" text-anchor="end" font-size="13.5" font-weight="800" fill="#10B981" class="mono">45+</text>
    </g>

    <!-- Row 4: Contributed Repos -->
    <g class="stat-row" transform="translate(0, 84)" style="animation-delay: 0.8s;">
      <circle cx="10" cy="0" r="4" fill="#F59E0B" />
      <text x="24" y="4" font-size="12.5" font-weight="600" fill="#F0FDF4">Repositories Architected</text>
      <text x="275" y="4" text-anchor="end" font-size="13.5" font-weight="800" fill="#F59E0B" class="mono">15+</text>
    </g>
  </g>
</svg>