<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1720" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.3" />
    </linearGradient>

    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@600;800;900&amp;display=swap');
    text { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    /* Subtle Card Border Breathing Glow */
    .stat-card-border {
      animation: statBorderGlow 4s ease-in-out infinite alternate;
    }
    @keyframes statBorderGlow {
      0% { stroke-opacity: 0.35; }
      100% { stroke-opacity: 0.75; filter: drop-shadow(0 0 4px rgba(0, 245, 160, 0.4)); }
    }

    /* Staggered Chip Glow Pulse */
    .metric-chip1 { animation: chipPulse 3s ease-in-out infinite alternate 0s; }
    .metric-chip2 { animation: chipPulse 3s ease-in-out infinite alternate 0.5s; }
    .metric-chip3 { animation: chipPulse 3s ease-in-out infinite alternate 1.0s; }
    .metric-chip4 { animation: chipPulse 3s ease-in-out infinite alternate 1.5s; }

    @keyframes chipPulse {
      0% { transform: translateY(0); }
      100% { transform: translateY(-2px); }
    }

    .sync-dot {
      animation: sDot 1.8s ease-in-out infinite alternate;
    }
    @keyframes sDot {
      0% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 4px #00F5A0); }
    }
  </style>

  <!-- Card Body -->
  <rect class="stat-card-border" width="678" height="178" x="1" y="1" rx="14" fill="url(#statsBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Header -->
  <text x="24" y="30" font-size="13" font-weight="800" fill="#00F5A0" letter-spacing="1.2">// GITHUB ACTIVITY &amp; METRICS</text>
  <circle cx="510" cy="26" r="3.5" fill="#00F5A0" class="sync-dot" />
  <text x="654" y="30" text-anchor="end" font-size="10.5" font-weight="700" fill="#00D9FF" class="mono">@luxtaic • VERIFIED LIVE</text>
  <line x1="24" y1="42" x2="654" y2="42" stroke="#00F5A0" stroke-width="1" stroke-opacity="0.18" />

  <!-- 4 Real Metric Chips (Subtle hover lift & glow) -->

  <!-- 1. Public Repositories -->
  <g class="metric-chip1" transform="translate(24, 60)">
    <rect width="145" height="85" rx="10" fill="rgba(0, 245, 160, 0.06)" stroke="#00F5A0" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="28" font-size="10" font-weight="700" fill="#8B949E">PUBLIC REPOS</text>
    <text x="18" y="62" font-size="28" font-weight="900" fill="#00F5A0" class="mono">4</text>
  </g>

  <!-- 2. Stars Earned -->
  <g class="metric-chip2" transform="translate(185, 60)">
    <rect width="145" height="85" rx="10" fill="rgba(0, 217, 255, 0.06)" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="28" font-size="10" font-weight="700" fill="#8B949E">STARS EARNED</text>
    <text x="18" y="62" font-size="28" font-weight="900" fill="#00D9FF" class="mono">0</text>
  </g>

  <!-- 3. Followers -->
  <g class="metric-chip3" transform="translate(346, 60)">
    <rect width="145" height="85" rx="10" fill="rgba(0, 245, 160, 0.06)" stroke="#00F5A0" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="28" font-size="10" font-weight="700" fill="#8B949E">FOLLOWERS</text>
    <text x="18" y="62" font-size="28" font-weight="900" fill="#00F5A0" class="mono">0</text>
  </g>

  <!-- 4. Following -->
  <g class="metric-chip4" transform="translate(507, 60)">
    <rect width="147" height="85" rx="10" fill="rgba(0, 217, 255, 0.06)" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="28" font-size="10" font-weight="700" fill="#8B949E">FOLLOWING</text>
    <text x="18" y="62" font-size="28" font-weight="900" fill="#00D9FF" class="mono">1</text>
  </g>

  <!-- Dynamic Footer note -->
  <text x="340" y="162" text-anchor="middle" font-size="9" fill="#8B949E">
    ⚡ GitHub activity updates automatically via GitHub Actions
  </text>
</svg>