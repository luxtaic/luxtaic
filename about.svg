<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1720" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&amp;display=swap');
    text { font-family: 'Fira Code', monospace; }

    .line-reveal1 { animation: lineFade 0.6s ease forwards 0.2s; opacity: 0; }
    .line-reveal2 { animation: lineFade 0.6s ease forwards 0.5s; opacity: 0; }
    .line-reveal3 { animation: lineFade 0.6s ease forwards 0.8s; opacity: 0; }
    .line-reveal4 { animation: lineFade 0.6s ease forwards 1.1s; opacity: 0; }

    @keyframes lineFade {
      to { opacity: 1; transform: translateY(0); }
    }

    .cursor-blink {
      animation: cBlink 0.9s step-end infinite;
    }
    @keyframes cBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <rect width="758" height="168" x="1" y="1" rx="12" fill="url(#aboutBg)" stroke="#00F5A0" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Terminal Header Bar -->
  <text x="24" y="28" font-size="12" font-weight="700" fill="#00F5A0">┌─ ABOUT SREEHARI ────────────────────────────────────────────────────────┐</text>

  <!-- Sequential Terminal Lines -->
  <g transform="translate(24, 40)" font-size="12.5">
    <g class="line-reveal1" transform="translate(0, 18)">
      <text x="0" y="0" fill="#00D9FF" font-weight="700">&gt; degree</text>
      <text x="120" y="0" fill="#8B949E">:</text>
      <text x="140" y="0" fill="#EAF2F2">BCA AI &amp; Data Science (Asian School of Business)</text>
    </g>

    <g class="line-reveal2" transform="translate(0, 44)">
      <text x="0" y="0" fill="#00F5A0" font-weight="700">&gt; focus</text>
      <text x="120" y="0" fill="#8B949E">:</text>
      <text x="140" y="0" fill="#EAF2F2">AI • Data Science • Web Development • Android</text>
    </g>

    <g class="line-reveal3" transform="translate(0, 70)">
      <text x="0" y="0" fill="#00D9FF" font-weight="700">&gt; currently</text>
      <text x="120" y="0" fill="#8B949E">:</text>
      <text x="140" y="0" fill="#EAF2F2">Building SmartCart (Inventory &amp; Retail Billing System)</text>
    </g>

    <g class="line-reveal4" transform="translate(0, 96)">
      <text x="0" y="0" fill="#00F5A0" font-weight="700">&gt; mindset</text>
      <text x="120" y="0" fill="#8B949E">:</text>
      <text x="140" y="0" fill="#EAF2F2">learn → build → improve</text>
      <rect x="350" y="-12" width="7" height="14" fill="#00F5A0" class="cursor-blink" />
    </g>
  </g>

  <text x="24" y="152" font-size="12" font-weight="700" fill="#00F5A0">└─────────────────────────────────────────────────────────────────────────┘</text>
</svg>