<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1720" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&amp;display=swap');
    text { font-family: 'Fira Code', monospace; }

    /* Sequential fade-in with strictly opacity animation: physically immune to coordinate collapse */
    .line-reveal1 { animation: lineFade 0.5s ease forwards 0.1s; opacity: 0; }
    .line-reveal2 { animation: lineFade 0.5s ease forwards 0.4s; opacity: 0; }
    .line-reveal3 { animation: lineFade 0.5s ease forwards 0.7s; opacity: 0; }
    .line-reveal4 { animation: lineFade 0.5s ease forwards 1.0s; opacity: 0; }

    @keyframes lineFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .cursor-blink {
      animation: cBlink 0.9s step-end infinite;
    }
    @keyframes cBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <rect width="758" height="168" x="1" y="1" rx="12" fill="url(#aboutBg)" stroke="#00F5A0" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Terminal Header Bar -->
  <text x="24" y="28" font-size="12" font-weight="700" fill="#00F5A0">┌─ ABOUT SREEHARI ────────────────────────────────────────────────────────┐</text>

  <!-- Sequential Terminal Lines (Fixed absolute y coordinates prevent any overlap) -->
  <!-- Line 1: Degree (y=58) -->
  <g class="line-reveal1" font-size="12.5">
    <text x="24" y="58" fill="#00D9FF" font-weight="700">&gt; degree</text>
    <text x="144" y="58" fill="#8B949E">:</text>
    <text x="164" y="58" fill="#EAF2F2">BCA AI &amp; Data Science (Asian School of Business)</text>
  </g>

  <!-- Line 2: Focus (y=84) -->
  <g class="line-reveal2" font-size="12.5">
    <text x="24" y="84" fill="#00F5A0" font-weight="700">&gt; focus</text>
    <text x="144" y="84" fill="#8B949E">:</text>
    <text x="164" y="84" fill="#EAF2F2">AI • Data Science • Web Development • Android</text>
  </g>

  <!-- Line 3: Currently (y=110) -->
  <g class="line-reveal3" font-size="12.5">
    <text x="24" y="110" fill="#00D9FF" font-weight="700">&gt; currently</text>
    <text x="144" y="110" fill="#8B949E">:</text>
    <text x="164" y="110" fill="#EAF2F2">Building SmartCart (Inventory &amp; Retail Billing System)</text>
  </g>

  <!-- Line 4: Mindset (y=136) -->
  <g class="line-reveal4" font-size="12.5">
    <text x="24" y="136" fill="#00F5A0" font-weight="700">&gt; mindset</text>
    <text x="144" y="136" fill="#8B949E">:</text>
    <text x="164" y="136" fill="#EAF2F2">learn → build → improve</text>
    <rect x="375" y="124" width="7" height="14" fill="#00F5A0" class="cursor-blink" />
  </g>

  <text x="24" y="156" font-size="12" font-weight="700" fill="#00F5A0">└─────────────────────────────────────────────────────────────────────────┘</text>
</svg>