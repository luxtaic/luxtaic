name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: luxtaic
          outputs: |
            dist/github-snake.svg?color_snake=#00F5A0&color_dots=#161b22,#0b3d2e,#007a55,#00c896,#00f5a0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5A0&color_dots=#0b0f14,#0b3d2e,#007a55,#00c896,#00f5a0

      - name: Deploy Output Files to output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
