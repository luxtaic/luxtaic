name: Update Real GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *" # Run daily at 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch real GitHub statistics & update stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(stats): update real GitHub telemetry metrics"
            git push
          fi
