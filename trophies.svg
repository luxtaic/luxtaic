<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D0A" />
      <stop offset="100%" stop-color="#0B1A14" />
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="trophiesClip">
      <rect width="800" height="160" rx="16" />
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&amp;display=swap');
    text { font-family: 'Inter', sans-serif; }

    /* Pop-in animation on inner wrapper so outer translate position is untouched */
    .trophy-inner {
      opacity: 0;
      animation: fadeInTrophy 0.6s ease-out forwards;
    }
    @keyframes fadeInTrophy {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Shine sweep */
    .shine-sweep {
      animation: sweepAcross 4s ease-in-out infinite;
    }
    @keyframes sweepAcross {
      0% { transform: translateX(-300px) skewX(-20deg); }
      35%, 100% { transform: translateX(950px) skewX(-20deg); }
    }
  </style>

  <g clip-path="url(#trophiesClip)">
    <!-- Base Background -->
    <rect width="800" height="160" fill="url(#trophyBg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" rx="16" />

    <!-- 4 Trophy Cells: Static Parent Positioning (18, 210, 402, 594) -->

    <!-- Trophy 1: Code Architect -->
    <g transform="translate(18, 16)">
      <g class="trophy-inner" style="animation-delay: 0.1s;">
        <rect width="180" height="128" rx="12" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.2" />
        <circle cx="90" cy="40" r="22" fill="rgba(0, 255, 136, 0.15)" stroke="#00FF88" stroke-width="1.5" />
        <text x="90" y="47" text-anchor="middle" font-size="20">🏆</text>
        <text x="90" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#F0FDF4">Code Architect</text>
        <rect x="55" y="94" width="70" height="20" rx="10" fill="#00FF88" />
        <text x="90" y="108" text-anchor="middle" font-size="11" font-weight="900" fill="#060D0A">RANK S+</text>
      </g>
    </g>

    <!-- Trophy 2: Commit Machine -->
    <g transform="translate(210, 16)">
      <g class="trophy-inner" style="animation-delay: 0.25s;">
        <rect width="180" height="128" rx="12" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="1.2" />
        <circle cx="90" cy="40" r="22" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="1.5" />
        <text x="90" y="47" text-anchor="middle" font-size="20">⚡</text>
        <text x="90" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#F0FDF4">Commit Machine</text>
        <rect x="55" y="94" width="70" height="20" rx="10" fill="#00F0FF" />
        <text x="90" y="108" text-anchor="middle" font-size="11" font-weight="900" fill="#060D0A">RANK A++</text>
      </g>
    </g>

    <!-- Trophy 3: Problem Solver -->
    <g transform="translate(402, 16)">
      <g class="trophy-inner" style="animation-delay: 0.4s;">
        <rect width="180" height="128" rx="12" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="1.2" />
        <circle cx="90" cy="40" r="22" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5" />
        <text x="90" y="47" text-anchor="middle" font-size="20">💡</text>
        <text x="90" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#F0FDF4">Problem Solver</text>
        <rect x="55" y="94" width="70" height="20" rx="10" fill="#F59E0B" />
        <text x="90" y="108" text-anchor="middle" font-size="11" font-weight="900" fill="#060D0A">RANK S</text>
      </g>
    </g>

    <!-- Trophy 4: Pragmatic Dev -->
    <g transform="translate(594, 16)">
      <g class="trophy-inner" style="animation-delay: 0.55s;">
        <rect width="188" height="128" rx="12" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.2" />
        <circle cx="94" cy="40" r="22" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" />
        <text x="94" y="47" text-anchor="middle" font-size="20">☕</text>
        <text x="94" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#F0FDF4">Pragmatic Dev</text>
        <rect x="59" y="94" width="70" height="20" rx="10" fill="#10B981" />
        <text x="94" y="108" text-anchor="middle" font-size="11" font-weight="900" fill="#060D0A">RANK MAX</text>
      </g>
    </g>

    <!-- Holographic Shine Sweep Bar -->
    <rect class="shine-sweep" x="0" y="0" width="120" height="160" fill="url(#shineGrad)" />
  </g>
</svg>